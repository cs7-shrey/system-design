services:
  primary:
    image: postgres:17
    container_name: postgres-primary
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: app
    ports:
      # Host port 5432 is already used by the Homebrew PostgreSQL instance.
      - "5434:5432"
    volumes:
      - primary-data:/var/lib/postgresql/data
      - ./primary-init.sh:/docker-entrypoint-initdb.d/primary-init.sh:ro
    command:
      - postgres
      - -c
      - wal_level=replica
      - -c
      - max_wal_senders=10
      - -c
      - max_replication_slots=10
      - -c
      - hot_standby=on
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d app"]
      interval: 2s
      timeout: 2s
      retries: 20

  replica:
    image: postgres:17
    container_name: postgres-replica
    environment:
      PGDATA: /var/lib/postgresql/data
      REPLICATION_USER: replicator
      REPLICATION_PASSWORD: replica_password
    ports:
      - "5433:5432"
    volumes:
      - replica-data:/var/lib/postgresql/data
      - ./replica-entrypoint.sh:/replica-entrypoint.sh:ro
    entrypoint: ["/bin/bash", "/replica-entrypoint.sh"]
    depends_on:
      primary:
        condition: service_healthy

volumes:
  primary-data:
  replica-data: